[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "midterms-senate-model"
version = "0.1.0"
description = "U.S. Senate seat-by-seat and chamber-wide probability model (2026 Midterms research system)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<2",
  "pandas>=2.1,<3",
  "scipy>=1.11,<1.14",
  "pyyaml>=6.0",
  "pyarrow>=14.0,<17",
  "pymc>=5.10,<6",
  "arviz>=0.17,<0.20",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "httpx>=0.27",
  "pydantic>=2.5",
  "cryptography>=42.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.3"]

[project.scripts]
midterms = "midterms.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["midterms*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
