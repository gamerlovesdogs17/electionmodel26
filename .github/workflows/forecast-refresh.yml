name: Forecast refresh

on:
  workflow_dispatch:
  schedule:
    # Mondays 14:00 UTC — research refresh hook (manual also OK)
    - cron: "0 14 * * 1"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e ".[dev]" || pip install -e .
      - name: Refresh chain (no live network secrets required for fixtures path)
        run: |
          python -m midterms.cli write-results-archive
          python -m midterms.cli monitor-check --min-polls 1 --min-enop 0 || true
        env:
          PYTHONPATH: .
