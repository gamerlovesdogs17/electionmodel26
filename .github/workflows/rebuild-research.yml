name: Rebuild Research Forecast

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: Forecast evidence cutoff YYYY-MM-DD. Leave blank for current UTC date.
        required: false
        type: string
        default: ""
      refresh_safe_sources:
        description: Refresh only source adapters approved for unattended preparation.
        required: true
        type: boolean
        default: true
      resume_run_id:
        description: Optional failed run ID whose verified OOF and completed model work should be reused.
        required: false
        type: string
        default: ""

concurrency:
  group: research-rebuild
  cancel-in-progress: false

jobs:
  prepare_evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      as_of: ${{ steps.resolve.outputs.as_of }}
      evidence_bundle_id: ${{ steps.bundle.outputs.evidence_bundle_id }}
      evidence_commit_sha: ${{ steps.commit.outputs.evidence_commit_sha }}
    steps:
      - name: Checkout main for evidence preparation
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Resolve AS_OF
        id: resolve
        shell: bash
        env:
          REQUESTED_AS_OF: ${{ inputs.as_of }}
        run: |
          TODAY="$(date -u +%F)"
          AS_OF="${REQUESTED_AS_OF:-$TODAY}"
          [[ "$AS_OF" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "invalid ISO date" >&2; exit 1; }
          [[ "$(date -u -d "$AS_OF" +%F 2>/dev/null || true)" == "$AS_OF" ]] || { echo "invalid calendar date" >&2; exit 1; }
          [[ "$AS_OF" > "$TODAY" ]] && { echo "as_of cannot be later than $TODAY" >&2; exit 1; }
          echo "AS_OF=$AS_OF" >> "$GITHUB_ENV"
          echo "as_of=$AS_OF" >> "$GITHUB_OUTPUT"
      - name: Require AS_OF on or after current candidate registry review
        run: |
          python - <<'PY'
          import os
          from datetime import date
          from midterms.config import DEMO_AS_OF
          from midterms.evidence.current_candidates import load_current_candidate_registry
          as_of = date.fromisoformat(os.environ["AS_OF"])
          reviewed = date.fromisoformat(
              str(load_current_candidate_registry()["reviewed_as_of"])
          )
          demo = date.fromisoformat(DEMO_AS_OF)
          if as_of < reviewed:
              raise SystemExit(
                  f"AS_OF {as_of} precedes current registry reviewed_as_of {reviewed}"
              )
          if demo < reviewed:
              raise SystemExit(
                  f"DEMO_AS_OF {demo} precedes current registry reviewed_as_of {reviewed}"
              )
          print("as_of registry boundary ok", as_of, "reviewed", reviewed, "demo", demo)
          PY
      - name: Materialize presidential prior snapshot for AS_OF
        run: |
          python - <<'PY'
          from datetime import date
          import os
          from midterms.evidence.presidential_prior import materialize_prior_snapshot
          as_of = date.fromisoformat(os.environ["AS_OF"])
          snapshot, path = materialize_prior_snapshot(as_of)
          if not snapshot.get("production_eligible"):
              raise SystemExit(f"prior snapshot is not production eligible: {path}")
          print(path)
          print("snapshot_sha256", snapshot.get("snapshot_sha256"))
          PY
      - name: Source readiness audit
        run: python -m midterms.cli source-readiness --election-id senate-2026 --as-of "$AS_OF" --summary --strict
      - name: Refresh safe sources
        # Resuming a failed rebuild must keep the sealed evidence bundle identity
        # stable so the prior research-rebuild-<bundle_id> artifact can download
        # and verify. Refreshing sources here would risk a new bundle id and a
        # forced full OOF/forecast rerun.
        if: inputs.refresh_safe_sources && inputs.resume_run_id == ''
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m midterms.cli prepare-evidence --election-id senate-2026 --as-of "$AS_OF" --mode refresh-safe --summary --strict
      - name: Fail-closed source and forecast coverage gate
        run: python -m midterms.cli source-readiness --election-id senate-2026 --as-of "$AS_OF" --summary --strict
      - name: Verify official Alaska source archive
        run: python -m midterms.cli prepare-alaska-rcv
      - name: Refresh cheap exceptional validation artifacts
        run: |
          python -m midterms.cli validate-non-major-adapter --current-as-of "$AS_OF"
          python -m midterms.cli validate-alaska-rcv --as-of "$AS_OF"
      - name: Strict exceptional-model and coverage preflight
        run: python -m midterms.cli verify-exceptional-models --strict
      - name: Synchronize compliance readiness metadata
        run: python -m midterms.cli sync-compliance-status --write
      - name: Seal and strictly verify evidence bundle
        run: python -m midterms.cli prepare-evidence --election-id senate-2026 --as-of "$AS_OF" --mode seal --strict
      - name: Strict publication-domain eligibility
        # Same gate as the rebuild job. Fail here (cheap) rather than after
        # evidence seal + tests when registry/timeline freshness is wrong.
        run: |
          python -m midterms.cli evidence-eligibility \
            --election-id senate-2026 \
            --as-of "$AS_OF" \
            --publication-config \
            --strict
      - name: Strict blueprint source gates
        run: python -m midterms.cli blueprint-extension-gates --source-only --strict
      - name: Read sealed bundle ID
        id: bundle
        shell: bash
        run: |
          BUNDLE_ID="$(python -c "import json; print(json.load(open('data/manifests/evidence_bundle_latest.json'))['evidence_bundle_id'])")"
          echo "evidence_bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-evidence-${{ steps.resolve.outputs.as_of }}
          path: |
            data/artifacts/source_readiness_latest.json
            data/artifacts/current_race_poll_coverage_v0923.json
            data/artifacts/evidence_eligibility_latest.json
            data/artifacts/non_major_adapter_validation_latest.json
            data/artifacts/alaska_rcv_validation_latest.json
            data/artifacts/historical_evidence_equivalence_v0923.json
            BLUEPRINT_COMPLIANCE_AUDIT.json
            data/manifests/
            data/normalized/
            data/raw/external/
      - name: Commit coherent evidence state
        id: commit
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/external data/normalized data/manifests \
            data/artifacts/source_readiness_latest.json \
            data/artifacts/current_race_poll_coverage_v0923.json \
            data/artifacts/evidence_eligibility_latest.json \
            data/artifacts/non_major_adapter_validation_latest.json \
            data/artifacts/alaska_rcv_validation_latest.json \
            data/artifacts/historical_evidence_equivalence_v0923.json \
            BLUEPRINT_COMPLIANCE_AUDIT.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence: seal research snapshot ${AS_OF} [no-model-fit]"
            git push origin HEAD:main
          fi
          echo "evidence_commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  tests:
    needs: prepare_evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact evidence commit for tests
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare_evidence.outputs.evidence_commit_sha }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Verify sealed publication eligibility artifact
        # Read-only check of the prepare_evidence seal. Do not recompute
        # eligibility here — forecast tests below may mutate sealed stores.
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          path = Path("data/artifacts/evidence_eligibility_latest.json")
          report = json.loads(path.read_text(encoding="utf-8"))
          if not report.get("publishable"):
              raise SystemExit(f"sealed eligibility not publishable: {report.get('reasons')}")
          freshness = (report.get("domains") or {}).get("candidate_timeline", {}).get("freshness") or {}
          if freshness.get("status") != "fresh":
              raise SystemExit(f"sealed candidate_timeline freshness not fresh: {freshness}")
          print("sealed eligibility ok", report.get("as_of"), freshness.get("identity_freshness_basis"))
          PY
      - name: Run evidence-compatible regression suite
        # Order: read-only / sealed-state checks first, then adapters, then
        # forecast smokes last (they can mutate normalized stores in-process).
        run: |
          pytest -q \
            tests/test_demo_as_of_registry_boundary.py \
            tests/test_pre_rebuild_hardening.py \
            tests/test_strict_cli_and_workflow.py \
            tests/test_release_identity_versioning.py \
            tests/test_validation_report_status_refresh.py \
            tests/test_alaska_rcv_adapter_v0923.py \
            tests/test_exceptional_model_lineage_v0923.py \
            tests/test_non_major_adapter_v0923.py \
            tests/test_v0923_candidate_matchup_integrity.py \
            tests/test_model.py \
            tests/test_improvements.py::test_forecast_ensemble_artifact
      - name: Smoke forecast at sealed evidence cutoff
        run: |
          python - <<'PY'
          import os
          from midterms.pipeline.run_forecast import run_forecast
          as_of = os.environ["AS_OF"]
          result = run_forecast(
              method="fast",
              draws=200,
              seed=11,
              ensemble=False,
              as_of=as_of,
              election_id="senate-2026",
          )
          art = result["artifact"]
          assert art["chamber"]["expected_dem_seats"] > 0
          assert len(art["races"]) >= 30
          print("sealed-as-of smoke ok", as_of, len(art["races"]))
          PY
        env:
          AS_OF: ${{ needs.prepare_evidence.outputs.as_of }}

  rebuild:
    needs: [prepare_evidence, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    outputs:
      commit_created: ${{ steps.commit.outputs.commit_created }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    env:
      AS_OF: ${{ needs.prepare_evidence.outputs.as_of }}
      EVIDENCE_BUNDLE_ID: ${{ needs.prepare_evidence.outputs.evidence_bundle_id }}
    steps:
      - name: Checkout exact evidence commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare_evidence.outputs.evidence_commit_sha }}
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Verify exact sealed evidence bundle
        shell: bash
        run: |
          BUNDLE_FILE="$(python -c "import json; p=json.load(open('data/manifests/evidence_bundle_latest.json')); print('data/manifests/'+p['manifest'])")"
          echo "EVIDENCE_BUNDLE_PATH=$BUNDLE_FILE" >> "$GITHUB_ENV"
          python -m midterms.cli verify-evidence-bundle --path "$BUNDLE_FILE" --expected-id "$EVIDENCE_BUNDLE_ID"
      - name: Strict effective publication-domain eligibility
        run: |
          python -m midterms.cli evidence-eligibility \
            --election-id senate-2026 \
            --as-of "$AS_OF" \
            --publication-config \
            --strict
      - name: Strict exceptional-model, candidate, coverage, and history preflight
        run: |
          python -c "from midterms.evidence.current_candidates import load_current_candidate_registry; print(load_current_candidate_registry()['registry_sha256'])"
          python -m midterms.cli verify-exceptional-models --strict
          python -m midterms.cli sync-compliance-status
      - name: Download prior failed-run checkpoint
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: research-rebuild-${{ needs.prepare_evidence.outputs.evidence_bundle_id }}
          path: .resume-checkpoint
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Verify and restore prior failed-run checkpoint
        id: resume
        if: inputs.resume_run_id != ''
        shell: bash
        run: |
          python -m midterms.cli restore-rebuild-checkpoint \
            --source-root .resume-checkpoint \
            --evidence-bundle "$EVIDENCE_BUNDLE_PATH" \
            --artifacts-dir data/artifacts | tee "$RUNNER_TEMP/rebuild-checkpoint.json"
          echo "resumed=true" >> "$GITHUB_OUTPUT"
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          report = json.loads(Path(os.environ["RUNNER_TEMP"]).joinpath("rebuild-checkpoint.json").read_text())
          print(f"forecast_resumed={str(bool(report.get('forecast_restored'))).lower()}")
          print(f"independent_resumed={str(bool(report.get('independent_rebuild_restored'))).lower()}")
          print(f"forecast_run_id={report.get('forecast_run_id') or ''}")
          PY
      - name: Historical structural-feature parity (pre-OOF)
        if: steps.resume.outputs.resumed != 'true'
        run: |
          python -m midterms.cli historical-model-feature-parity \
            --out data/artifacts/historical_model_feature_parity_v0923.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path("data/artifacts/historical_model_feature_parity_v0923.json").read_text())
          if payload.get("status") != "parity_ok":
              raise SystemExit(f"structural feature parity failed: {payload.get('n_parity_mismatches')}")
          if payload.get("n_parity_mismatches", 1) != 0:
              raise SystemExit("structural feature parity mismatches present")
          if not payload.get("aggregate_historical_structural_features_sha256"):
              raise SystemExit("missing aggregate historical structural feature hash")
          # Pre-integration OOF artifacts lack structural-feature lineage; remove them
          # so ordinary OOF cannot be reused under a stale identity.
          for name in (
              "nested_component_loo_selection.json",
              "nested_component_loo_selection_frozen.json",
              "nested_component_loo_canonical.json",
              "nested_component_loo_canonical_frozen.json",
              "poll_structure_crossfit_latest.json",
          ):
              path = Path("data/artifacts") / name
              if not path.is_file():
                  continue
              report = json.loads(path.read_text(encoding="utf-8"))
              has_lineage = bool(report.get("historical_structural_feature_sha256_by_fold_lead"))
              schema_ok = (
                  report.get("historical_structural_feature_schema")
                  == "historical-structural-features-v1"
              )
              if name.startswith("poll_structure"):
                  # Crossfit is derived from selection OOF; drop if companion OOF is stale.
                  continue
              if not has_lineage or not schema_ok:
                  print(f"removing stale ordinary OOF artifact without structural lineage: {name}")
                  path.unlink()
          print("historical structural feature parity ok")
          PY
      - name: Restore poll-structure selection-pass cache
        id: selection-cache
        if: steps.resume.outputs.resumed != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/artifacts/nested_component_loo_selection.json
            data/artifacts/nested_component_loo_selection_frozen.json
            data/artifacts/posterior_predictive_oof_latest.json
            data/artifacts/poll_structure_crossfit_latest.json
          # Ordinary selection OOF keys only on ordinary statistical inputs.
          # Exceptional adapters are verified separately via verify-exceptional-models
          # and must not invalidate expensive ordinary PyMC OOF caches.
          # struct-v1 bumps cache identity after race-id finance + personal incumbency wiring.
          key: selection-oof-v0923-struct-v1-${{ github.sha }}-${{ needs.prepare_evidence.outputs.evidence_bundle_id }}-2018-2024-60-30-single-additions-pymc1600-seed-v2
      - name: Selection-pass freeze-before-truth OOF and same-family challengers
        if: steps.resume.outputs.resumed != 'true' && steps.selection-cache.outputs.cache-hit != 'true'
        run: |
          python -m midterms.cli nested-component-loo \
            --hierarchical-method pymc \
            --years 2018,2020,2022,2024 \
            --leads 60,30 \
            --draws 1600 \
            --validation-phase poll_structure_selection \
            --evidence-bundle "$EVIDENCE_BUNDLE_PATH" \
            --out data/artifacts/nested_component_loo_selection.json
      - name: Cross-fit single-term poll-structure selection
        if: steps.resume.outputs.resumed != 'true'
        run: |
          python - <<'PY'
          import json, os
          nested = json.load(open('data/artifacts/nested_component_loo_selection.json'))
          if nested.get('evidence_bundle_id') != os.environ['EVIDENCE_BUNDLE_ID']:
            raise SystemExit('cached historical OOF belongs to a different evidence bundle')
          if nested.get('validation_phase') != 'poll_structure_selection':
            raise SystemExit('selection cache phase mismatch')
          PY
          python -m midterms.cli poll-structure-crossfit \
            --nested-path data/artifacts/nested_component_loo_selection.json \
            --out data/artifacts/poll_structure_crossfit_latest.json \
            --strict
      - name: Freeze selected structure and evidence into candidate model spec
        id: candidate_spec
        shell: bash
        run: |
          # Always (re)freeze so selection G8 structural enables bind into the
          # ordinary-statistical identity — including resume paths that restored
          # a pre-enables candidate from an older failed run.
          python -m midterms.cli freeze-model-spec-candidate \
            --selection data/artifacts/poll_structure_crossfit_latest.json \
            --evidence-bundle "$EVIDENCE_BUNDLE_PATH" \
            --source-readiness data/artifacts/source_readiness_latest.json \
            --code-commit-sha "$(git rev-parse HEAD)" \
            --out data/artifacts/validated_model_spec_candidate.json
          ORD_SHA="$(python -c "import json; print(json.load(open('data/artifacts/validated_model_spec_candidate.json'))['ordinary_statistical_spec_sha256'])")"
          echo "ordinary_statistical_spec_sha256=$ORD_SHA" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          candidate_path = Path("data/artifacts/validated_model_spec_candidate.json")
          candidate = json.loads(candidate_path.read_text(encoding="utf-8"))
          candidate_sha = hashlib.sha256(candidate_path.read_bytes()).hexdigest()
          canonical_path = Path("data/artifacts/nested_component_loo_canonical.json")
          invalidate = False
          if canonical_path.is_file():
              canonical = json.loads(canonical_path.read_text(encoding="utf-8"))
              if canonical.get("model_spec_candidate_sha256") != candidate_sha:
                  invalidate = True
              enables = candidate.get("structural_feature_enables") or {}
              if set(enables) != {"similarity_terminal", "terminal_race"}:
                  invalidate = True
          if invalidate:
              for name in (
                  "nested_component_loo_canonical.json",
                  "nested_component_loo_canonical_frozen.json",
                  "posterior_predictive_oof_latest.json",
                  "stack_weights_oof.json",
                  "stack_reliability_crossfit_latest.json",
                  "joint_oof_scores_latest.json",
                  "validated_model_spec_latest.json",
                  "forecast_latest.json",
                  "prior_predictive_latest.json",
                  "race_decomposition_latest.json",
                  "independent_rebuild_latest.json",
                  "run_coherence_latest.json",
                  "acceptance_gates_latest.json",
              ):
                  path = Path("data/artifacts") / name
                  if path.is_file():
                      path.unlink()
                      print(f"removed stale downstream artifact: {name}")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as handle:
              handle.write(f"invalidate_canonical={str(invalidate).lower()}\n")
          PY
      - name: Save selection-pass validation cache
        if: steps.resume.outputs.resumed != 'true' && steps.selection-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/artifacts/nested_component_loo_selection.json
            data/artifacts/nested_component_loo_selection_frozen.json
            data/artifacts/posterior_predictive_oof_latest.json
            data/artifacts/poll_structure_crossfit_latest.json
          key: selection-oof-v0923-struct-v1-${{ github.sha }}-${{ needs.prepare_evidence.outputs.evidence_bundle_id }}-2018-2024-60-30-single-additions-pymc1600-seed-v2
      - name: Restore canonical selected-structure OOF cache
        id: canonical-cache
        if: steps.resume.outputs.resumed != 'true' && steps.candidate_spec.outputs.invalidate_canonical != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/artifacts/nested_component_loo_canonical.json
            data/artifacts/nested_component_loo_canonical_frozen.json
            data/artifacts/posterior_predictive_oof_latest.json
          # Ordinary-statistical identity only — not whole candidate JSON / exceptional lineage.
          key: canonical-oof-v0923-struct-v1-${{ github.sha }}-${{ needs.prepare_evidence.outputs.evidence_bundle_id }}-${{ steps.candidate_spec.outputs.ordinary_statistical_spec_sha256 }}-2018-2024-60-30-pymc1600-seed-v2
      - name: Canonical OOF using the frozen selected poll structure
        if: >
          (steps.resume.outputs.resumed != 'true' &&
           steps.canonical-cache.outputs.cache-hit != 'true') ||
          steps.candidate_spec.outputs.invalidate_canonical == 'true'
        run: |
          python -m midterms.cli nested-component-loo \
            --hierarchical-method pymc \
            --years 2018,2020,2022,2024 \
            --leads 60,30 \
            --draws 1600 \
            --validation-phase canonical_poll_structure \
            --model-spec-candidate data/artifacts/validated_model_spec_candidate.json \
            --evidence-bundle "$EVIDENCE_BUNDLE_PATH" \
            --out data/artifacts/nested_component_loo_canonical.json
      - name: Recover convergence-failed canonical PyMC folds
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys

          report_path = Path("data/artifacts/nested_component_loo_canonical.json")
          index_path = report_path.with_name(f"{report_path.stem}_frozen.json")
          index = json.loads(index_path.read_text(encoding="utf-8"))
          failures = sorted(
              (entry for entry in index.get("entries", []) if entry.get("status") == "failed"),
              key=lambda entry: (
                  int(entry.get("holdout_year", 0)),
                  int(entry.get("lead_days", 0)),
                  str(entry.get("component", "")),
              ),
          )
          unsupported = [
              entry for entry in failures
              if entry.get("component") not in {"pymc", "pymc_dynamic"}
          ]
          if unsupported:
              raise SystemExit(
                  "canonical OOF contains non-PyMC failures that cannot be repaired: "
                  + json.dumps(unsupported, sort_keys=True)
              )
          if not failures:
              print("Canonical OOF has no convergence-failed PyMC folds.")
          for entry in failures:
              command = [
                  sys.executable, "-m", "midterms.cli", "repair-failed-oof-inference",
                  "--year", str(entry["holdout_year"]),
                  "--lead", str(entry["lead_days"]),
                  "--component", str(entry["component"]),
                  "--nested-path", str(report_path),
                  "--draws-per-chain", "2000",
                  "--tune-per-chain", "4000",
                  "--chains", "4",
                  "--target-accept", "0.99",
              ]
              print("Recovering", entry["component"], entry["holdout_year"], entry["lead_days"])
              subprocess.run(command, check=True)

          # Each repair subprocess fits from the truth-free index before it opens the
          # scored report. This final check runs only after every repair subprocess exits.
          report = json.loads(report_path.read_text(encoding="utf-8"))
          if report.get("failures"):
              raise SystemExit(
                  "canonical OOF still contains failures after convergence recovery: "
                  + json.dumps(report["failures"], sort_keys=True)
              )
          PY
      - name: Save canonical OOF cache
        if: steps.resume.outputs.resumed != 'true' && steps.canonical-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/artifacts/nested_component_loo_canonical.json
            data/artifacts/nested_component_loo_canonical_frozen.json
            data/artifacts/posterior_predictive_oof_latest.json
          key: canonical-oof-v0923-struct-v1-${{ github.sha }}-${{ needs.prepare_evidence.outputs.evidence_bundle_id }}-${{ steps.candidate_spec.outputs.ordinary_statistical_spec_sha256 }}-2018-2024-60-30-pymc1600-seed-v2
      - name: Fit predictive-mixture stack from canonical OOF only
        if: >
          steps.resume.outputs.forecast_resumed != 'true' ||
          steps.candidate_spec.outputs.invalidate_canonical == 'true'
        run: |
          python -m midterms.cli fit-stack-weights \
            --nested-path data/artifacts/nested_component_loo_canonical.json \
            --out data/artifacts/stack_weights_oof.json \
            --require-canonical
      - name: Cross-fitted production-stack reliability
        if: >
          steps.resume.outputs.forecast_resumed != 'true' ||
          steps.candidate_spec.outputs.invalidate_canonical == 'true'
        run: |
          python -m midterms.cli crossfit-stack-reliability \
            --nested-path data/artifacts/nested_component_loo_canonical.json \
            --stack-path data/artifacts/stack_weights_oof.json
      - name: Joint historical proper scores
        if: >
          steps.resume.outputs.forecast_resumed != 'true' ||
          steps.candidate_spec.outputs.invalidate_canonical == 'true'
        run: |
          python -m midterms.cli joint-oof-scores --strict \
            --nested-path data/artifacts/nested_component_loo_canonical.json
      - name: Finalize validated model spec
        if: >
          steps.resume.outputs.forecast_resumed != 'true' ||
          steps.candidate_spec.outputs.invalidate_canonical == 'true'
        run: |
          python -m midterms.cli finalize-validated-model-spec \
            --candidate data/artifacts/validated_model_spec_candidate.json \
            --canonical-oof data/artifacts/nested_component_loo_canonical.json \
            --stack data/artifacts/stack_weights_oof.json \
            --calibration data/artifacts/stack_reliability_crossfit_latest.json \
            --code-commit-sha "$(git rev-parse HEAD)" \
            --out data/artifacts/validated_model_spec_latest.json
      - name: Run publication-quality research forecast
        if: >
          steps.resume.outputs.forecast_resumed != 'true' ||
          steps.candidate_spec.outputs.invalidate_canonical == 'true'
        run: |
          python -m midterms.cli forecast \
            --election-id senate-2026 \
            --as-of "$AS_OF" \
            --method pymc \
            --require-publishable \
            --tune 4000 \
            --target-accept 0.99 \
            --n-joint-sims 50000
      - name: Verify forecast exceptional-model attribution and lineage
        if: >
          steps.resume.outputs.forecast_resumed != 'true' ||
          steps.candidate_spec.outputs.invalidate_canonical == 'true'
        run: |
          python - <<'PY'
          import json
          from midterms.validation.exceptional_model_lineage import validate_forecast_model_paths
          from midterms.validation.validated_model_spec import load_validated_model_spec, verify_validated_spec_artifacts
          forecast = json.load(open('data/artifacts/forecast_latest.json'))
          spec, _ = load_validated_model_spec()
          verify_validated_spec_artifacts(spec)
          print(validate_forecast_model_paths(forecast, spec))
          PY
      - name: Numerical quality
        run: python -m midterms.cli numerical-check --publishable
      - name: Validation report and reused posterior diagnostics
        run: python -m midterms.cli validation-report --full
      - name: Independent rebuild
        if: >
          steps.resume.outputs.independent_resumed != 'true' ||
          steps.candidate_spec.outputs.invalidate_canonical == 'true'
        run: python -m midterms.cli verify-rebuild --independent
      - name: Seal current version release identity
        run: python -m midterms.cli release-identity
      - name: Seal current forecast shadow
        run: python -m midterms.cli shadow-publish --mode live
      - name: Run coherence check
        run: |
          python - <<'PY'
          from midterms.ops.run_coherence import write_coherence_report
          result = write_coherence_report()
          print(result)
          if not result.get("ok"):
              raise SystemExit(1)
          PY
      - name: G1-G11 and blueprint extension gates
        run: python -m midterms.cli acceptance-gates --strict
      - name: Refresh final validation report status
        run: python -m midterms.cli validation-report --refresh-status-only
      - name: Upload generated model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-rebuild-${{ needs.prepare_evidence.outputs.evidence_bundle_id }}
          path: |
            data/artifacts/
            data/releases/
            data/manifests/
            data/shadow/
            web/public/data/forecast_latest.json
      - name: Refuse artifact push if main diverged from evidence commit
        if: success()
        shell: bash
        run: |
          git fetch origin main
          [[ "$(git rev-parse origin/main)" == "${{ needs.prepare_evidence.outputs.evidence_commit_sha }}" ]] || {
            echo "origin/main changed after evidence seal; refusing mixed-lineage artifact commit" >&2
            exit 1
          }
      - name: Commit successful model artifacts
        id: commit
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artifacts data/releases data/manifests data/shadow web/public/data/forecast_latest.json
          if git diff --cached --quiet; then
            echo "commit_created=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "model: rebuild research forecast ${AS_OF} [bundle ${EVIDENCE_BUNDLE_ID}]"
            git push origin HEAD:main
            echo "commit_created=true" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  deploy_pages:
    needs: [prepare_evidence, rebuild]
    if: needs.rebuild.result == 'success' && needs.rebuild.outputs.commit_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout updated main after model artifact commit
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build static site
        working-directory: web
        env:
          GITHUB_PAGES: "true"
        run: |
          npm ci
          npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
