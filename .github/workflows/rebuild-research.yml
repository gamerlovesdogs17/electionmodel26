name: Rebuild Research Forecast

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Run full test suite
        run: pytest -q

      - name: Run publication-quality research forecast
        run: |
          python -m midterms.cli forecast \
            --election-id senate-2026 \
            --as-of 2026-09-20 \
            --method pymc \
            --require-publishable \
            --n-joint-sims 50000

      - name: Numerical quality
        run: python -m midterms.cli numerical-check --publishable

      - name: Validation report
        run: python -m midterms.cli validation-report --full

      - name: Independent rebuild
        run: python -m midterms.cli verify-rebuild --independent

      - name: Run coherence check
        run: |
          python - <<'PY'
          from midterms.ops.run_coherence import write_coherence_report
          result = write_coherence_report()
          print(result)
          if not result.get("ok"):
              raise SystemExit(1)
          PY

      - name: Acceptance gates
        run: python -m midterms.cli acceptance-gates

      - name: Upload generated artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-forecast-artifacts
          path: |
            data/artifacts/
            data/releases/
            data/manifests/
            web/public/data/forecast_latest.json

      - name: Commit successful rebuild
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/artifacts data/releases data/manifests web/public/data/forecast_latest.json

          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "model: rebuild research forecast 2026-09-20"
            git push
          fi
