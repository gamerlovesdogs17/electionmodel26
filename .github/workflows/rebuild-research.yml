name: Rebuild Research Forecast

on:
  workflow_dispatch:
    inputs:
      as_of:
        description: Forecast evidence cutoff YYYY-MM-DD. Leave blank for current UTC date.
        required: false
        type: string
        default: ""
      refresh_safe_sources:
        description: Refresh only source adapters approved for unattended preparation.
        required: true
        type: boolean
        default: true
      resume_run_id:
        description: Optional failed rebuild run ID whose lineage-checked OOF checkpoint should be reused.
        required: false
        type: string
        default: ""

concurrency:
  group: research-rebuild
  cancel-in-progress: false

jobs:
  prepare_evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
    outputs:
      as_of: ${{ steps.resolve.outputs.as_of }}
      evidence_bundle_id: ${{ steps.bundle.outputs.evidence_bundle_id }}
      evidence_commit_sha: ${{ steps.commit.outputs.evidence_commit_sha }}
    steps:
      - name: Checkout main for evidence preparation
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Resolve AS_OF
        id: resolve
        shell: bash
        env:
          REQUESTED_AS_OF: ${{ inputs.as_of }}
        run: |
          TODAY="$(date -u +%F)"
          AS_OF="${REQUESTED_AS_OF:-$TODAY}"
          [[ "$AS_OF" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]] || { echo "invalid ISO date" >&2; exit 1; }
          [[ "$(date -u -d "$AS_OF" +%F 2>/dev/null || true)" == "$AS_OF" ]] || { echo "invalid calendar date" >&2; exit 1; }
          [[ "$AS_OF" > "$TODAY" ]] && { echo "as_of cannot be later than $TODAY" >&2; exit 1; }
          echo "AS_OF=$AS_OF" >> "$GITHUB_ENV"
          echo "as_of=$AS_OF" >> "$GITHUB_OUTPUT"
      - name: Source readiness audit
        run: python -m midterms.cli source-readiness --election-id senate-2026 --as-of "$AS_OF"
      - name: Refresh safe sources
        if: inputs.refresh_safe_sources
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: python -m midterms.cli prepare-evidence --election-id senate-2026 --as-of "$AS_OF" --mode refresh-safe
      - name: Seal and strictly verify evidence bundle
        run: python -m midterms.cli prepare-evidence --election-id senate-2026 --as-of "$AS_OF" --mode seal --strict
      - name: Strict blueprint source gates
        run: python -m midterms.cli blueprint-extension-gates --source-only --strict
      - name: Read sealed bundle ID
        id: bundle
        shell: bash
        run: |
          BUNDLE_ID="$(python -c "import json; print(json.load(open('data/manifests/evidence_bundle_latest.json'))['evidence_bundle_id'])")"
          echo "evidence_bundle_id=$BUNDLE_ID" >> "$GITHUB_OUTPUT"
      - name: Upload evidence artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-evidence-${{ steps.resolve.outputs.as_of }}
          path: |
            data/artifacts/source_readiness_latest.json
            data/manifests/
            data/normalized/
            data/raw/external/
      - name: Commit coherent evidence state
        id: commit
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/raw/external data/normalized data/manifests data/artifacts/source_readiness_latest.json
          if ! git diff --cached --quiet; then
            git commit -m "evidence: seal research snapshot ${AS_OF} [no-model-fit]"
            git push origin HEAD:main
          fi
          echo "evidence_commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  tests:
    needs: prepare_evidence
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout exact evidence commit for tests
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare_evidence.outputs.evidence_commit_sha }}
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Run full test suite in isolated checkout
        run: pytest -q

  rebuild:
    needs: [prepare_evidence, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: write
      actions: read
    outputs:
      commit_created: ${{ steps.commit.outputs.commit_created }}
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
    env:
      AS_OF: ${{ needs.prepare_evidence.outputs.as_of }}
      EVIDENCE_BUNDLE_ID: ${{ needs.prepare_evidence.outputs.evidence_bundle_id }}
    steps:
      - name: Checkout exact evidence commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare_evidence.outputs.evidence_commit_sha }}
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Verify exact sealed evidence bundle
        shell: bash
        run: |
          BUNDLE_FILE="$(python -c "import json; p=json.load(open('data/manifests/evidence_bundle_latest.json')); print('data/manifests/'+p['manifest'])")"
          echo "EVIDENCE_BUNDLE_PATH=$BUNDLE_FILE" >> "$GITHUB_ENV"
          python -m midterms.cli verify-evidence-bundle --path "$BUNDLE_FILE" --expected-id "$EVIDENCE_BUNDLE_ID"
      - name: Strict effective publication-domain eligibility
        run: |
          python -m midterms.cli evidence-eligibility \
            --election-id senate-2026 \
            --as-of "$AS_OF" \
            --publication-config \
            --strict
      - name: Download prior failed-run checkpoint
        if: inputs.resume_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: research-rebuild-${{ needs.prepare_evidence.outputs.evidence_bundle_id }}
          path: .resume-checkpoint
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.resume_run_id }}
      - name: Verify and restore prior failed-run checkpoint
        id: resume
        if: inputs.resume_run_id != ''
        shell: bash
        run: |
          python -m midterms.cli restore-rebuild-checkpoint \
            --source-root .resume-checkpoint \
            --evidence-bundle "$EVIDENCE_BUNDLE_PATH" \
            --artifacts-dir data/artifacts
          echo "resumed=true" >> "$GITHUB_OUTPUT"
      - name: Restore poll-structure selection-pass cache
        id: selection-cache
        if: steps.resume.outputs.resumed != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/artifacts/nested_component_loo_selection.json
            data/artifacts/nested_component_loo_selection_frozen.json
            data/artifacts/posterior_predictive_oof_latest.json
            data/artifacts/poll_structure_crossfit_latest.json
          key: selection-oof-v0922-${{ github.sha }}-${{ needs.prepare_evidence.outputs.evidence_bundle_id }}-2018-2024-60-30-single-additions-pymc1600-seed-v2
      - name: Selection-pass freeze-before-truth OOF and same-family challengers
        if: steps.resume.outputs.resumed != 'true' && steps.selection-cache.outputs.cache-hit != 'true'
        run: |
          python -m midterms.cli nested-component-loo \
            --hierarchical-method pymc \
            --years 2018,2020,2022,2024 \
            --leads 60,30 \
            --draws 1600 \
            --validation-phase poll_structure_selection \
            --evidence-bundle "$EVIDENCE_BUNDLE_PATH" \
            --out data/artifacts/nested_component_loo_selection.json
      - name: Cross-fit single-term poll-structure selection
        if: steps.resume.outputs.resumed != 'true'
        run: |
          python - <<'PY'
          import json, os
          nested = json.load(open('data/artifacts/nested_component_loo_selection.json'))
          if nested.get('evidence_bundle_id') != os.environ['EVIDENCE_BUNDLE_ID']:
            raise SystemExit('cached historical OOF belongs to a different evidence bundle')
          if nested.get('validation_phase') != 'poll_structure_selection':
            raise SystemExit('selection cache phase mismatch')
          PY
          python -m midterms.cli poll-structure-crossfit \
            --nested-path data/artifacts/nested_component_loo_selection.json \
            --out data/artifacts/poll_structure_crossfit_latest.json \
            --strict
      - name: Freeze selected structure and evidence into candidate model spec
        if: steps.resume.outputs.resumed != 'true'
        run: |
          python -m midterms.cli freeze-model-spec-candidate \
            --selection data/artifacts/poll_structure_crossfit_latest.json \
            --evidence-bundle "$EVIDENCE_BUNDLE_PATH" \
            --source-readiness data/artifacts/source_readiness_latest.json \
            --code-commit-sha "$(git rev-parse HEAD)" \
            --out data/artifacts/validated_model_spec_candidate.json
      - name: Save selection-pass validation cache
        if: steps.resume.outputs.resumed != 'true' && steps.selection-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/artifacts/nested_component_loo_selection.json
            data/artifacts/nested_component_loo_selection_frozen.json
            data/artifacts/posterior_predictive_oof_latest.json
            data/artifacts/poll_structure_crossfit_latest.json
          key: selection-oof-v0922-${{ github.sha }}-${{ needs.prepare_evidence.outputs.evidence_bundle_id }}-2018-2024-60-30-single-additions-pymc1600-seed-v2
      - name: Restore canonical selected-structure OOF cache
        id: canonical-cache
        if: steps.resume.outputs.resumed != 'true'
        uses: actions/cache/restore@v4
        with:
          path: |
            data/artifacts/nested_component_loo_canonical.json
            data/artifacts/nested_component_loo_canonical_frozen.json
            data/artifacts/posterior_predictive_oof_latest.json
          key: canonical-oof-v0922-${{ github.sha }}-${{ needs.prepare_evidence.outputs.evidence_bundle_id }}-${{ hashFiles('data/artifacts/validated_model_spec_candidate.json') }}-2018-2024-60-30-pymc1600-seed-v2
      - name: Canonical OOF using the frozen selected poll structure
        if: steps.resume.outputs.resumed != 'true' && steps.canonical-cache.outputs.cache-hit != 'true'
        run: |
          python -m midterms.cli nested-component-loo \
            --hierarchical-method pymc \
            --years 2018,2020,2022,2024 \
            --leads 60,30 \
            --draws 1600 \
            --validation-phase canonical_poll_structure \
            --model-spec-candidate data/artifacts/validated_model_spec_candidate.json \
            --evidence-bundle "$EVIDENCE_BUNDLE_PATH" \
            --out data/artifacts/nested_component_loo_canonical.json
      - name: Recover convergence-failed canonical PyMC folds
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import subprocess
          import sys

          report_path = Path("data/artifacts/nested_component_loo_canonical.json")
          index_path = report_path.with_name(f"{report_path.stem}_frozen.json")
          index = json.loads(index_path.read_text(encoding="utf-8"))
          failures = sorted(
              (entry for entry in index.get("entries", []) if entry.get("status") == "failed"),
              key=lambda entry: (
                  int(entry.get("holdout_year", 0)),
                  int(entry.get("lead_days", 0)),
                  str(entry.get("component", "")),
              ),
          )
          unsupported = [
              entry for entry in failures
              if entry.get("component") not in {"pymc", "pymc_dynamic"}
          ]
          if unsupported:
              raise SystemExit(
                  "canonical OOF contains non-PyMC failures that cannot be repaired: "
                  + json.dumps(unsupported, sort_keys=True)
              )
          if not failures:
              print("Canonical OOF has no convergence-failed PyMC folds.")
          for entry in failures:
              command = [
                  sys.executable, "-m", "midterms.cli", "repair-failed-oof-inference",
                  "--year", str(entry["holdout_year"]),
                  "--lead", str(entry["lead_days"]),
                  "--component", str(entry["component"]),
                  "--nested-path", str(report_path),
                  "--draws-per-chain", "2000",
                  "--tune-per-chain", "4000",
                  "--chains", "4",
                  "--target-accept", "0.99",
              ]
              print("Recovering", entry["component"], entry["holdout_year"], entry["lead_days"])
              subprocess.run(command, check=True)

          # Each repair subprocess fits from the truth-free index before it opens the
          # scored report. This final check runs only after every repair subprocess exits.
          report = json.loads(report_path.read_text(encoding="utf-8"))
          if report.get("failures"):
              raise SystemExit(
                  "canonical OOF still contains failures after convergence recovery: "
                  + json.dumps(report["failures"], sort_keys=True)
              )
          PY
      - name: Save canonical OOF cache
        if: steps.canonical-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            data/artifacts/nested_component_loo_canonical.json
            data/artifacts/nested_component_loo_canonical_frozen.json
            data/artifacts/posterior_predictive_oof_latest.json
          key: canonical-oof-v0922-${{ github.sha }}-${{ needs.prepare_evidence.outputs.evidence_bundle_id }}-${{ hashFiles('data/artifacts/validated_model_spec_candidate.json') }}-2018-2024-60-30-pymc1600-seed-v2
      - name: Fit predictive-mixture stack from canonical OOF only
        run: |
          python -m midterms.cli fit-stack-weights \
            --nested-path data/artifacts/nested_component_loo_canonical.json \
            --out data/artifacts/stack_weights_oof.json \
            --require-canonical
      - name: Cross-fitted production-stack reliability
        run: |
          python -m midterms.cli crossfit-stack-reliability \
            --nested-path data/artifacts/nested_component_loo_canonical.json \
            --stack-path data/artifacts/stack_weights_oof.json
      - name: Joint historical proper scores
        run: |
          python -m midterms.cli joint-oof-scores --strict \
            --nested-path data/artifacts/nested_component_loo_canonical.json
      - name: Finalize validated model spec
        run: |
          python -m midterms.cli finalize-validated-model-spec \
            --candidate data/artifacts/validated_model_spec_candidate.json \
            --canonical-oof data/artifacts/nested_component_loo_canonical.json \
            --stack data/artifacts/stack_weights_oof.json \
            --calibration data/artifacts/stack_reliability_crossfit_latest.json \
            --code-commit-sha "$(git rev-parse HEAD)" \
            --out data/artifacts/validated_model_spec_latest.json
      - name: Run publication-quality research forecast
        run: |
          python -m midterms.cli forecast \
            --election-id senate-2026 \
            --as-of "$AS_OF" \
            --method pymc \
            --require-publishable \
            --tune 4000 \
            --target-accept 0.99 \
            --n-joint-sims 50000
      - name: Numerical quality
        run: python -m midterms.cli numerical-check --publishable
      - name: Validation report and reused posterior diagnostics
        run: python -m midterms.cli validation-report --full
      - name: Independent rebuild
        run: python -m midterms.cli verify-rebuild --independent
      - name: Run coherence check
        run: |
          python - <<'PY'
          from midterms.ops.run_coherence import write_coherence_report
          result = write_coherence_report()
          print(result)
          if not result.get("ok"):
              raise SystemExit(1)
          PY
      - name: G1-G11 and blueprint extension gates
        run: python -m midterms.cli acceptance-gates --strict
      - name: Upload generated model artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: research-rebuild-${{ needs.prepare_evidence.outputs.evidence_bundle_id }}
          path: |
            data/artifacts/
            data/releases/
            data/manifests/
            web/public/data/forecast_latest.json
      - name: Refuse artifact push if main diverged from evidence commit
        if: success()
        shell: bash
        run: |
          git fetch origin main
          [[ "$(git rev-parse origin/main)" == "${{ needs.prepare_evidence.outputs.evidence_commit_sha }}" ]] || {
            echo "origin/main changed after evidence seal; refusing mixed-lineage artifact commit" >&2
            exit 1
          }
      - name: Commit successful model artifacts
        id: commit
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/artifacts data/releases data/manifests web/public/data/forecast_latest.json
          if git diff --cached --quiet; then
            echo "commit_created=false" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            git commit -m "model: rebuild research forecast ${AS_OF} [bundle ${EVIDENCE_BUNDLE_ID}]"
            git push origin HEAD:main
            echo "commit_created=true" >> "$GITHUB_OUTPUT"
            echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          fi

  deploy_pages:
    needs: [prepare_evidence, rebuild]
    if: needs.rebuild.result == 'success' && needs.rebuild.outputs.commit_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout updated main after model artifact commit
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install and build static site
        working-directory: web
        env:
          GITHUB_PAGES: "true"
        run: |
          npm ci
          npm run build
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: web/out
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
